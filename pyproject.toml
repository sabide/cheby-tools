[build-system]
requires = ["scikit-build-core>=1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "cheby-tools"
version = "0.1.0"
description = "Spectral post-processing tools for Chebyshev and Fourier grids"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.23",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "scikit-build-core>=1.0",
    "twine>=5",
]

[project.urls]
Repository = "https://github.com/sabide/cheby-tools"

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["cheby_tools"]
sdist.inclusion-mode = "explicit"
sdist.include = [
    "pyproject.toml",
    "README.md",
    "cheby_tools/**",
    "CMakeLists.txt",
    "native/tecio/**",
    "external/boost/**",
    "external/tecio/teciosrc/**",
    "external/pybind11/CMakeLists.txt",
    "external/pybind11/LICENSE",
    "external/pybind11/include/**",
    "external/pybind11/tools/**",
    "examples/*.py",
]
sdist.exclude = [
    "tests/**",
    "docs/**",
    "external/pybind11/docs/**",
    "external/pybind11/tests/**",
    "build/**",
    "dist/**",
]

[tool.scikit-build.cmake.define]
CHEBY_INSTALL_PYTHON_CORE = false
